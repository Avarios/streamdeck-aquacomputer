<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Sensor">
    <sdpi-select setting="sensor" default="1" datasource="getSensors" loading="Reading Quadro ..." placeholder="Temp 1"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Label">
    <sdpi-textfield setting="label" placeholder="e.g. Loop out"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Warn at (°C)">
    <sdpi-textfield setting="warn" placeholder="e.g. 40"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Unit">
    <sdpi-checkbox setting="fahrenheit" label="Show °F"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="Graph window">
    <sdpi-select setting="window" placeholder="5 min" default="5">
      <option value="1">1 min</option><option value="5">5 min</option>
      <option value="15">15 min</option><option value="30">30 min</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Graph">
    <sdpi-checkbox setting="noGraph" label="Hide background graph"></sdpi-checkbox>
  </sdpi-item>
  <p style="opacity:.6;font-size:11px;margin:8px 12px">Unofficial plugin. Currently tested only with the Aquacomputer Quadro.</p>
</body>
</html>
