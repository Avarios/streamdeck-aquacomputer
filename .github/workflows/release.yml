name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run release
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.streamDeckPlugin"
